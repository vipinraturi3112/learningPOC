<div style="display: flex; min-height: 100vh; font-family: sans-serif">
  <nav style="width: 180px; padding: 1rem; border-right: 1px solid #ddd">
    <h3>Lessons</h3>
    @for (l of lessons; track l.path) {
      <a
        [routerLink]="l.path"
        routerLinkActive
        #rla="routerLinkActive"
        style="display: block; padding: 0.5rem; margin-bottom: 0.25rem; border-radius: 4px; text-decoration: none"
        [style.background]="rla.isActive ? '#333' : '#f0f0f0'"
        [style.color]="rla.isActive ? '#fff' : '#000'"
      >
        {{ l.title }}
      </a>
    }
  </nav>
  <main style="flex: 1; padding: 1.5rem">
    <router-outlet />
  </main>
</div>
